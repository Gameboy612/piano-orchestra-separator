<!doctype html><meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116"><title>Comparison player</title>
<style>
:root{--bg:#0f1116;--card:#171a21;--line:#272c36;--fg:#e8eaed;--dim:#98a1ab;--acc:#4f7cff;--good:#3aa76d}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--line:#e2e6ec;--fg:#14171c;--dim:#5a636d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
select{font:inherit;font-size:14.5px;padding:11px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);width:100%}
.lbl{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 5px}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:10px;cursor:pointer;padding:10px 12px;min-height:44px}
button:active{opacity:.7}
button.pill{font-size:13px;padding:9px 12px;min-height:40px}
button.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
#play{width:52px;height:52px;min-height:52px;border-radius:50%;background:var(--acc);border-color:var(--acc);
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:88px;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}
.blend{display:flex;align-items:center;gap:10px;margin-top:4px}
.blend span{font-size:12px;color:var(--dim);white-space:nowrap}
.blend b{color:var(--fg);font-weight:600}
.meta{color:var(--dim);font-size:12.5px;margin-top:10px;min-height:34px}
.ok{color:var(--good);font-weight:600}
.warn{color:#c0752b}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.sticky .inner{max-width:760px;margin:0 auto}
@media (min-width:700px){.sticky .inner{display:flex;gap:12px;align-items:center}
 .sticky .seekwrap{flex:1}.sticky .blend{width:260px;margin:0}}
.seekwrap{display:flex;align-items:center;gap:10px;margin-top:8px}
</style>
<div class=wrap>
 <h1>Piano / orchestra separation — comparison player</h1>
 <div class=sub>Pick a track, pick a model, drag the slider between the piano stem and the
 orchestra stem. <a href="../index.html" style="color:var(--acc)">&larr; separator demo</a></div>
 <div class=panel>
  <div class=lbl>Track</div>
  <select id=track></select>
  <div class=meta id=meta></div>
  <div class=lbl>Model</div>
  <div class=row id=models></div>
 </div>
</div>
<div class=sticky><div class=inner>
 <div class=row>
  <button id=play aria-label=play>&#9654;</button>
  <div class=seekwrap><input id=seek type=range min=0 max=1000 value=0>
   <span class=time id=time>0:00 / 0:00</span></div>
 </div>
 <div class=blend>
  <span>piano</span><input id=blend type=range min=0 max=100 value=50><span>orchestra</span>
 </div>
</div></div>

const el=id=>document.getElementById(id);
const A={mix:new Audio(),piano:new Audio(),orch:new Audio()};
Object.values(A).forEach(a=>{a.preload='none';a.setAttribute('playsinline','');});
let ctx=null,gains={},srcs={};
function initAudio(){
  if(ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
  for(const k of ['piano','orch']){
    srcs[k]=ctx.createMediaElementSource(A[k]); gains[k]=ctx.createGain();
    srcs[k].connect(gains[k]).connect(ctx.destination);
  }
  setBlend(+el('blend').value/100);
}
function setBlend(t){
  const p=Math.cos(t*Math.PI/2), o=Math.sin(t*Math.PI/2);
  if(gains.piano) gains.piano.gain.value=p;
  if(gains.orch) gains.orch.gain.value=o;
  if(A.mix) A.mix.volume=1;
}
let tracks=[],cur=null,model=null,playing=false;
const flat=[];
DATA.forEach((g,gi)=>g.items.forEach((it,ii)=>flat.push({...it,group:g.title,key:gi+'-'+ii})));
function fmt(t){t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
function fillTracks(){
  const sel=el('track'); sel.innerHTML='';
  DATA.forEach((g,gi)=>{
    const og=document.createElement('optgroup'); og.label=g.title;
    g.items.forEach((it,ii)=>{
      const o=document.createElement('option'); o.value=gi+'-'+ii;
      o.textContent=it.id+(it.condition?' — '+it.condition:'');
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.onchange=()=>select(sel.value);
}
function modelsFor(t){
  const names=Object.keys(t.models);
  const order=['mixture (input)','ground truth','base UMX20','fine-tuned v1','fine-tuned v2',
               'fine-tuned v4','loss-tuned v5','student 5 MB','symmetric loss','asymmetric loss'];
  const list=order.filter(n=>n==='mixture (input)'?!!cur.mixture:names.includes(n));
  return list;
}
function select(key){
  cur=flat.find(x=>x.key===key);
  if(!cur) return;
  const ms=modelsFor(cur);
  const box=el('models'); box.innerHTML='';
  ms.forEach(n=>{
    const b=document.createElement('button'); b.className='pill'+(n===model?' on':'');
    b.textContent=n; b.onclick=()=>setModel(n);
    box.appendChild(b);
  });
  if(!ms.includes(model)) model=ms.includes('fine-tuned v4')?'fine-tuned v4':ms[0];
  [...box.children].forEach(b=>b.classList.toggle('on',b.textContent===model));
  const sc=cur.score&&cur.score.a!=null&&cur.score.b!=null;
  el('meta').innerHTML=(cur.condition?'<b>'+cur.condition+'</b> · ':'')+
    (cur.preset?cur.preset+' · ':'')+
    (sc?('SI-SDR base <span class=ok>'+cur.score.a.toFixed(2)+'</span> &rarr; fine-tuned <span class=ok>'+
        cur.score.b.toFixed(2)+'</span> dB'):'');
  load();
}
function setModel(n){
  model=n;
  [...el('models').children].forEach(b=>b.classList.toggle('on',b.textContent===n));
  load(true);                      // keep the playback position across the switch
}
function srcFor(role){
  const m=cur.models[model]||{};
  return m[role]||null;
}
function load(keepTime){
  const prevClock=clock();
  const t=keepTime?(prevClock.currentTime||0):0;
  const wasPlaying=playing;
  const sp=srcFor('piano'), so=srcFor('orch');
  el('play').disabled=false;
  const oneStem=(!!sp) !== (!!so);
  const useMix=(model==='mixture (input)')||(!sp&&!so);
  A.mix.src=useMix?(cur.mixture||''):'';
  const blendOff=useMix||oneStem;
  el('blend').style.opacity=blendOff?0.3:1; el('blend').disabled=blendOff;
  if(useMix){A.piano.removeAttribute('src');A.orch.removeAttribute('src');A.piano.load();A.orch.load();}
  else{
    const pb=sp||so, ob=so||sp;
    A.piano.src=pb; A.orch.src=ob;
    A.piano.load(); A.orch.load();
  }
  const c2=useMix?A.mix:A.piano;
  const go=()=>{ try{ c2.currentTime=t; }catch(e){} if(wasPlaying) startPlay(); updTime(); };
  c2.addEventListener('loadedmetadata',go,{once:true});
  if(c2.readyState>=1) go();
  updTime();
}
function startPlay(){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  const hasStems=A.piano.src && A.orch.src;
  if(hasStems){ A.piano.currentTime=A.orch.currentTime; A.piano.play().catch(()=>{}); A.orch.play().catch(()=>{}); }
  else A.mix.play().catch(()=>{});
  playing=true; el('play').innerHTML='&#10074;&#10074;';
}
function stopPlay(){
  A.piano.pause(); A.orch.pause(); A.mix.pause(); playing=false; el('play').innerHTML='&#9654;';
}
function clock(){ return (A.piano.src&&!A.mix.src)?A.piano:A.mix; }
function updTime(){
  const c=clock(); const d=c.duration||0;
  el('time').textContent=fmt(c.currentTime)+' / '+fmt(d);
  if(d) el('seek').value=1000*c.currentTime/d;
}
setInterval(()=>{ if(playing) updTime(); },200);
el('play').onclick=()=> playing?stopPlay():startPlay();
el('seek').oninput=()=>{
  const c=clock(); if(!c.duration) return;
  const t=c.duration*el('seek').value/1000;
  c.currentTime=t; if(A.piano.src&&A.orch.src) A.orch.currentTime=t;
};
el('blend').oninput=()=>setBlend(+el('blend').value/100);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault(); playing?stopPlay():startPlay();}
  if(e.key==='ArrowRight'){const c=clock(); c.currentTime=(c.currentTime||0)+2;}
  if(e.key==='ArrowLeft'){const c=clock(); c.currentTime=Math.max(0,(c.currentTime||0)-2);}
});
fillTracks(); select(el('track').options[0].value);
